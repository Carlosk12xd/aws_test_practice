<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AWS Practice Test</title><style>
:root{--bg:#f3f5f3;--paper:#fff;--ink:#183c34;--muted:#60726b;--line:#dce5df;--green:#19624d;--tint:#edf6ef;--red:#a83339}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,sans-serif}main{max-width:960px;margin:auto;padding:35px 24px 60px}header{margin-bottom:28px}header small{font-size:12px;font-weight:750;letter-spacing:.16em;color:var(--green)}h1{font-size:clamp(31px,5vw,43px);letter-spacing:-.04em;line-height:1.2;margin:9px 0}h2{font-size:25px;line-height:1.35;margin:10px 0 20px}h3{font-size:20px;line-height:1.5;margin:14px 0 22px}p{margin:8px 0 17px}.muted{color:var(--muted)}.small{font-size:13px}.panel{padding:28px;background:var(--paper);border:1px solid var(--line);border-radius:17px;margin-bottom:20px}button,input,select{font:inherit;color:inherit}button,select{background:var(--paper);border:1px solid var(--line);border-radius:9px;padding:10px 15px}button{cursor:pointer}button:hover:not(:disabled){border-color:var(--green)}button:disabled{cursor:default;opacity:.5}button:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid #dabd72;outline-offset:3px}.primary{background:var(--green);color:white;border-color:var(--green);font-weight:650}.flex{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.settings{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:25px 0}.settings label{font-size:13px;font-weight:700}.settings select{display:block;width:100%;margin-top:6px}.choices{display:grid;gap:11px}.choice{display:flex;gap:13px;align-items:center;text-align:left;padding:16px;border:2px solid var(--line);line-height:1.5}.choice .letter{display:grid;place-items:center;width:32px;min-width:32px;height:32px;border:1px solid var(--line);border-radius:7px;font-weight:750}.choice .label{flex:1}.choice.selected{border-color:var(--green);background:var(--tint)}.choice:disabled{opacity:1;color:var(--ink)}.choice.correct{border-color:#298450;background:#edf8ef}.choice.wrong{border-color:var(--red);background:#fff1f1}.feedback{border-left:4px solid #298450;background:var(--tint);padding:18px 21px;border-radius:8px;margin-top:22px}.feedback.incorrect{border-left-color:var(--red)}.feedback h4{margin:0 0 7px}.feedback p:last-child{margin-bottom:0}.feedback ul{padding-left:20px;margin:6px 0 14px}.progress{height:6px;background:var(--line);border-radius:4px;overflow:hidden;margin:15px 0 24px}.progress span{display:block;background:var(--green);height:100%}.nav{margin-top:25px}.tag{font-size:12px;color:var(--muted);font-weight:650}.map{display:grid;grid-template-columns:repeat(auto-fill,minmax(48px,1fr));gap:8px;margin-top:15px}.map .answered{background:var(--tint);border-color:var(--green)}.map [aria-current]{outline:3px solid #d7b65f}details{margin-top:20px}summary{cursor:pointer}.notice{padding:17px;background:#fff7df;border:1px solid #e7d199;border-radius:9px;margin-top:20px}.score{font-size:46px;line-height:1.2;margin:15px 0}.tablewrap{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}th,td{text-align:left;border-bottom:1px solid var(--line);padding:10px 5px}.review{border-top:1px solid var(--line);margin-top:23px;padding-top:15px}footer{font-size:12px;color:var(--muted);margin-top:25px}.check{margin-top:15px}@media(max-width:600px){main{padding:22px 14px 45px}.panel{padding:19px}.settings{grid-template-columns:1fr}.choice{padding:12px;font-size:14px}.score{font-size:38px}}
</style></head><body><main><header><small>AWS CLOUD PRACTITIONER</small><h1>Practice test</h1><p class="muted">Choose a topic or mix them together. Get the answer and explanation as you go.</p></header><div id="app"></div><footer>Fresh start every time you open or reload. Works offline. Practice scores are not official exam results.<div style="font-size:11px;margin-top:8px">by Carlos Knight</div></footer></main><script type="application/json" id="quiz-data">{"topics":["Cloud foundations \u0026 global infrastructure","Costs, accounts \u0026 support","Identity, security \u0026 compliance","Monitoring, protection \u0026 governance","Networking \u0026 delivery","Compute \u0026 deployment","Storage","Databases","Architecture \u0026 integration","Migration, analytics \u0026 additional services"],"questions":[{"id":1,"topic":0,"q":"What is cloud computing, and what are its main economic benefits?","options":["On-demand resources, variable spending, and provider economies of scale","Fixed hardware purchases, prepaid capacity, and customer-owned facilities","On-demand resources, unlimited free usage, and no operating costs","Dedicated local servers, fixed capacity, and hardware ownership"],"correct":0,"a":"On-demand IT resources with usage-based pricing: trade large upfront purchases for variable spending, access capacity quickly, and benefit from provider economies of scale.","why":"You still pay for resources you leave running. Cloud savings depend on how you design and manage the workload.","type":"mc"},{"id":2,"topic":0,"q":"How do IaaS, PaaS, and SaaS differ?","options":["IaaS: infrastructure; PaaS: managed platform; SaaS: finished application","IaaS: finished application; PaaS: infrastructure; SaaS: managed platform","IaaS: managed platform; PaaS: finished application; SaaS: infrastructure","IaaS: private cloud; PaaS: public cloud; SaaS: hybrid cloud"],"correct":0,"a":"IaaS supplies infrastructure you configure; PaaS manages more of the platform so you focus on applications; SaaS delivers a finished application.","why":"The distinction is how much of the technology stack the provider manages, not whether the application uses the internet.","type":"mc"},{"id":3,"topic":0,"q":"What is a hybrid cloud deployment?","options":["An environment that connects on-premises resources with cloud resources","An environment that uses two AZs within a single AWS Region","An environment that uses only applications delivered through SaaS","An environment that runs multiple operating systems on one server"],"correct":0,"a":"An environment connecting on-premises infrastructure with cloud resources.","why":"Hybrid describes where the workload runs. IaaS, PaaS, and SaaS describe the type of service consumed.","type":"mc"},{"id":4,"topic":0,"q":"How do scalability and elasticity differ?","options":["Scalability handles growth; elasticity adjusts capacity as demand changes","Scalability adjusts prices; elasticity adjusts geographic location","Scalability encrypts traffic; elasticity replicates stored data","Scalability requires fixed capacity; elasticity requires fixed demand"],"correct":0,"a":"Scalability handles growth; elasticity adjusts capacity up and down as demand changes.","why":"A larger server can improve scalability. Automatically adding and removing servers is elasticity.","type":"mc"},{"id":5,"topic":0,"q":"How do horizontal and vertical scaling differ?","options":["Horizontal changes instance count; vertical changes instance size","Horizontal changes instance size; vertical changes instance count","Horizontal changes Regions; vertical changes Availability Zones","Horizontal changes storage class; vertical changes purchase model"],"correct":0,"a":"Horizontal scaling adds or removes instances; vertical scaling changes an instance's size or resources.","why":"Horizontal scaling also requires the application to distribute work. A larger machine alone does not remove a single point of failure.","type":"mc"},{"id":6,"topic":0,"q":"What does cloud agility mean?","options":["Provisioning resources and experimenting quickly to deliver changes sooner","Automatically adding or removing capacity when demand changes","Replicating data across Regions to meet recovery objectives","Purchasing reserved capacity to reduce predictable usage costs"],"correct":0,"a":"Provisioning resources and experimenting quickly, so teams can deliver changes sooner.","why":"Agility concerns speed of change; elasticity concerns capacity responding to demand.","type":"mc"},{"id":7,"topic":0,"q":"When should you use the Console, CLI, or an SDK?","options":["Console: browser management; CLI: scripts; SDK: calls from application code","Console: scripts; CLI: application libraries; SDK: browser management","Console: OS login; CLI: DNS management only; SDK: storage access only","Console: browser management; CLI: SSH credentials only; SDK: root access only"],"correct":0,"a":"Console for browser-based management; CLI for terminal commands and scripts; SDK for AWS API calls from application code.","why":"All require appropriate authorization. AWS CLI API credentials are not the SSH key used to log into an EC2 operating system.","type":"mc"},{"id":8,"topic":0,"q":"What are the six AWS CAF perspectives?","options":["Business, People, Governance, Platform, Security, Operations","Security, Reliability, Performance, Cost, Sustainability, Operations","Compute, Storage, Database, Networking, Analytics, Migration","Planning, Procurement, Provisioning, Testing, Deployment, Retirement"],"correct":0,"a":"Business, People, Governance, Platform, Security, and Operations.","why":"Business links cloud adoption to outcomes; People addresses skills; Governance manages oversight; Platform builds; Security protects; Operations runs.","type":"mc"},{"id":9,"topic":0,"q":"How do Regions, Availability Zones, and edge locations differ?","options":["Region: geographic area; AZ: isolated data centers; edge: nearby delivery","Region: a single server; AZ: geographic area; edge: a private subnet","Region: DNS zone; AZ: a cache location; edge: an entire continent","Region: account boundary; AZ: billing boundary; edge: storage boundary"],"correct":0,"a":"A Region is a geographic area; an AZ is an isolated group of one or more data centers within a Region; edge locations bring delivery closer to users.","why":"Multiple AZs help survive local failures. CloudFront edge locations cache content; they are not replacement names for Regions.","type":"mc"},{"id":10,"topic":0,"q":"What factors determine a suitable AWS Region?","options":["Residency requirements, latency, service availability, and cost","Only the Region with the lowest listed EC2 instance price","Only the Region geographically nearest to company headquarters","Number of IAM users, password length, and billing contact location"],"correct":0,"a":"Data-residency requirements, proximity and latency, service availability, and cost.","why":"Choose from the workload's requirements rather than always choosing the cheapest or nearest Region.","type":"mc"},{"id":11,"topic":1,"q":"What are the main AWS cost drivers, and what does TCO include?","options":["Compute, storage, transfer; plus staff, facilities, licensing, and operations","Compute usage alone; staffing and facilities do not affect TCO","Storage and software licenses only; data transfer is always free","Upfront equipment costs alone; recurring operating costs are excluded"],"correct":0,"a":"Compute, storage, and data transfer are major drivers. TCO also includes staff, facilities, licensing, maintenance, and operating effort.","why":"Compare equivalent workloads and service levels. Outbound and cross-boundary transfer can cost money; charges vary by service and route.","type":"mc"},{"id":12,"topic":1,"q":"How do Pricing Calculator, Cost Explorer, Budgets, and CUR 2.0 differ?","options":["Calculator estimates; Explorer analyzes; Budgets alerts; CUR exports details","Calculator analyzes bills; Explorer alerts; Budgets exports; CUR estimates","Calculator sets quotas; Explorer provisions; Budgets encrypts; CUR monitors","Calculator estimates; Explorer stores backups; Budgets stops all usage; CUR routes"],"correct":0,"a":"Calculator estimates a proposed design; Cost Explorer analyzes and forecasts spend; Budgets monitors thresholds; CUR 2.0 through Data Exports provides detailed cost-and-usage records.","why":"These are estimate, analyze, alert, and detailed-export tools. A budget alert alone does not automatically stop spending.","type":"mc"},{"id":13,"topic":1,"q":"How do cost allocation tags help a company?","options":["They attribute eligible costs to dimensions such as project or department","They automatically apply a discount to every tagged resource","They authorize users to access every resource with the same tag","They combine multiple Regions into a single lower-priced Region"],"correct":0,"a":"They label resources by dimensions such as team, project, or environment so eligible costs can be grouped and analyzed after activation for billing.","why":"Tags organize attribution; they do not automatically reduce the bill or grant access.","type":"mc"},{"id":14,"topic":1,"q":"What does AWS Organizations provide?","options":["Multi-account management, organization policies, and consolidated billing","Multi-account application deployment without any IAM configuration","A shared root password and merged identities across all accounts","Unlimited service quotas and free transfers between all accounts"],"correct":0,"a":"Central management of multiple AWS accounts, organizational units, policies, and consolidated billing.","why":"Eligible usage and commitment benefits can be shared subject to configuration and service rules; combining accounts does not make all usage free.","type":"mc"},{"id":15,"topic":1,"q":"What does a service control policy do?","options":["A maximum-permissions guardrail that does not itself grant access","A policy that grants access whenever an IAM policy denies it","A billing policy that reserves lower prices for member accounts","A resource policy that automatically applies to every management-account action"],"correct":0,"a":"An SCP sets a maximum-permissions guardrail for affected member accounts. It does not grant permissions.","why":"An IAM allow still needs to fit within applicable guardrails. SCPs do not restrict the management account itself.","type":"mc"},{"id":16,"topic":1,"q":"Which AWS Support plans should you recognize now?","options":["Basic; Business Support+; Enterprise Support; Unified Operations","Basic; Developer; Business; Enterprise are the current paid-plan comparison","Standard; Professional; Premium; Platinum are the current support tiers","Free; Growth; Scale; Global are the current support tiers"],"correct":0,"a":"Basic Support is included. The current paid-plan comparison lists Business Support+, Enterprise Support, and Unified Operations.","why":"Use the current comparison rather than memorizing the older Developer/Business/Enterprise table in the course PDFs.","type":"mc"},{"id":17,"topic":1,"q":"What does a TAM provide, and what are the business/mission-critical initial-response targets for Business Support+, Enterprise Support, and Unified Operations, respectively?","options":["Ongoing TAM guidance; critical initial targets under 30, 15, and 5 minutes respectively","Ongoing TAM guidance; guaranteed full repair within 30, 15, and 5 minutes respectively","TAM handles only invoices; all paid plans have a 24-hour critical initial target","TAM replaces incident support; all paid plans guarantee a five-minute repair"],"correct":0,"a":"A Technical Account Manager provides ongoing guidance. Initial human-response targets for business/mission-critical system down are under 30 minutes for Business Support+, under 15 for Enterprise, and under 5 from an Incident Management Engineer for Unified Operations.","why":"These are initial-response targets, not guaranteed repair times. Severity definitions and plan terms matter.","type":"mc"},{"id":18,"topic":1,"q":"How does the current AWS Free Tier work for a new account?","options":["$100 initial credits, up to $100 earned; Free plan ends at six months or exhausted credits","$200 monthly credits renewed forever; Free plan has no expiration","Every service is free for twelve months regardless of usage","No credits; all new accounts receive one permanently free EC2 instance"],"correct":0,"a":"New eligible customers receive $100 in credits and can earn up to $100 more. The Free plan ends after six months or when credits run out, whichever comes first.","why":"The Paid plan can incur usage charges beyond eligible credits. Always Free allowances and limited trials have their own terms; the old universal 12-month shortcut is inaccurate.","type":"mc"},{"id":19,"topic":1,"q":"How do On-Demand, Savings Plans, Reserved Instances, and Spot differ?","options":["On-Demand: flexible; Savings Plans/RIs: commitments; Spot: interruptible spare capacity","On-Demand: annual commitment; Savings Plans/RIs: spot bidding; Spot: dedicated hosts","On-Demand: interruptible; Savings Plans/RIs: free trial; Spot: guaranteed capacity","On-Demand: fixed hardware; Savings Plans/RIs: backups; Spot: long-term licensing"],"correct":0,"a":"On-Demand has no long-term usage commitment; Savings Plans discount eligible usage for a spending commitment; RIs discount matching usage for a term; Spot uses spare capacity that can be interrupted.","why":"Choose commitment discounts for predictable usage and Spot for interruption-tolerant work. Discounts and capacity reservations are separate concepts.","type":"mc"},{"id":20,"topic":1,"q":"When would Dedicated Hosts be useful?","options":["Physical-host visibility or control for eligible licensing and isolation needs","Running a function without managing its underlying servers","Guaranteeing the lowest price for every short-lived compute job","Automatically distributing HTTP requests across multiple targets"],"correct":0,"a":"When you need control or visibility at the physical-host level, such as specific eligible software licensing or isolation requirements.","why":"Dedicated Hosts differ from merely selecting a large EC2 instance. Dedicated Instances offer dedicated hardware without the same host-level control.","type":"mc"},{"id":21,"topic":2,"q":"Who secures what under shared responsibility?","options":["AWS secures infrastructure; customers secure data, access, and relevant configurations","AWS secures all applications; customers secure only physical data centers","AWS secures only the network; customers maintain the physical hypervisor","AWS secures customer data permissions; customers maintain hardware racks"],"correct":0,"a":"AWS secures underlying cloud infrastructure. Customers secure their data, identities, permissions, applications, and service configurations.","why":"For EC2, customers patch the guest OS. With managed services, AWS takes on more platform maintenance, but customer data and access remain customer responsibilities.","type":"mc"},{"id":22,"topic":2,"q":"How do an IAM user, group, role, and policy differ?","options":["User: identity; group: users; role: assumed identity; policy: permissions","User: permissions; group: temporary credentials; role: users; policy: identity","User: account; group: Regions; role: database; policy: password","User: identity; group: assumed identity; role: users; policy: billing record"],"correct":0,"a":"A user is an identity; a group collects IAM users; a role is assumed for temporary credentials; a policy defines permissions.","why":"A role can be assumed by authorized people or workloads. A group is not an identity that applications assume.","type":"mc"},{"id":23,"topic":2,"q":"What is least privilege, and what happens when an allow conflicts with an explicit deny?","options":["Grant only required access; an applicable explicit deny overrides an allow","Grant full access initially; an explicit allow always overrides a deny","Grant access by department size; the newest policy always wins","Grant access through resource names; denies apply only to console sessions"],"correct":0,"a":"Grant only the actions and resources needed. An applicable explicit deny overrides an allow.","why":"Review access as needs change. Permission boundaries and organization policies can further limit effective permissions.","type":"mc"},{"id":24,"topic":2,"q":"How should root access and MFA be handled?","options":["Protect root, use strong MFA, and reserve root for tasks requiring it","Use root for daily administration so individual roles are unnecessary","Share root credentials with administrators and disable MFA for emergencies","Create root access keys for applications and store them in source code"],"correct":0,"a":"Protect root credentials, enable strong MFA where root credentials exist, and reserve root access for tasks that require it.","why":"Use everyday administrative identities for routine work. Avoid creating root access keys, and prefer phishing-resistant MFA where available.","type":"mc"},{"id":25,"topic":2,"q":"What is the recommended access pattern for people and workloads?","options":["Federated temporary access for people; IAM roles for workloads","Permanent access keys for every person and hard-coded keys for applications","A shared root identity for people and a shared IAM user for workloads","Anonymous access for people and security groups as workload credentials"],"correct":0,"a":"People should use federation and temporary credentials, commonly through IAM Identity Center; workloads should use IAM roles with temporary credentials.","why":"Embedding permanent access keys in application code creates unnecessary credential exposure and rotation work.","type":"mc"},{"id":26,"topic":2,"q":"How do IAM Identity Center and Amazon Cognito differ?","options":["Identity Center: workforce access; Cognito: application-user authentication","Identity Center: application databases; Cognito: employee cost allocation","Identity Center: TLS certificates; Cognito: encryption-key rotation","Identity Center: threat detection; Cognito: operating-system patching"],"correct":0,"a":"Identity Center manages workforce access to AWS accounts and applications; Cognito provides authentication and identity features for users of your applications.","why":"Employees administering AWS and customers signing into a shopping app are different identity use cases.","type":"mc"},{"id":27,"topic":2,"q":"How do encryption at rest and in transit differ, and where does KMS fit?","options":["At rest: stored data; in transit: moving data; KMS: encryption-key management","At rest: moving data; in transit: stored data; KMS: certificate validation","At rest: IAM policies; in transit: subnets; KMS: password recovery","At rest: snapshots only; in transit: backups only; KMS: DNS routing"],"correct":0,"a":"At rest protects stored data; in transit protects moving data. KMS manages keys used by integrated AWS services.","why":"Encryption does not replace access control. Key permissions, data permissions, and secure transport all matter.","type":"mc"},{"id":28,"topic":2,"q":"How do ACM, KMS, and CloudHSM differ?","options":["ACM: TLS certificates; KMS: encryption keys; CloudHSM: dedicated HSMs","ACM: DNS records; KMS: firewalls; CloudHSM: compliance reports","ACM: encryption keys; KMS: TLS certificates; CloudHSM: shared file storage","ACM: passwords; KMS: SSH sessions; CloudHSM: threat detection"],"correct":0,"a":"ACM manages TLS certificates; KMS manages encryption keys; CloudHSM provides dedicated hardware security modules with more customer control.","why":"A certificate proves identity for TLS; it is not the same thing as a general data-encryption key. Route 53 can assist DNS validation but is not the certificate-management service.","type":"mc"},{"id":29,"topic":2,"q":"Does an AWS compliance certification automatically make your application compliant?","options":["No; customers still configure their workloads, using AWS reports as evidence","Yes; every application inherits all AWS certifications automatically","Yes; enabling encryption alone satisfies all compliance obligations","No; AWS certifications cannot support any customer compliance assessment"],"correct":0,"a":"No. AWS Artifact provides reports and agreements, while customers must configure and operate their workloads to meet applicable requirements.","why":"Provider controls are only one part of an application's compliance obligations.","type":"mc"},{"id":30,"topic":2,"q":"Does every penetration test require advance AWS approval?","options":["No; permitted tests on your own listed services can proceed under AWS policy","Yes; every test on every resource requires advance AWS approval","No; customers may test other customers' resources without permission","No; all denial-of-service simulations are automatically permitted"],"correct":0,"a":"No. Permitted testing of your own resources on listed services can proceed without prior approval, subject to AWS policy. Other simulations and activities have additional rules.","why":"Authorization to test your own application is not permission to test other customers or perform prohibited denial-of-service activity.","type":"mc"},{"id":31,"topic":3,"q":"How do CloudTrail, CloudWatch, and AWS Config differ?","options":["CloudTrail: activity; CloudWatch: metrics/logs; Config: configuration/rules","CloudTrail: metrics; CloudWatch: configuration; Config: API history","CloudTrail: backups; CloudWatch: certificates; Config: threat detection","CloudTrail: routing; CloudWatch: identity; Config: cost forecasts"],"correct":0,"a":"CloudTrail records account/API activity; CloudWatch monitors metrics and logs; Config tracks resource configuration and evaluates rules.","why":"Remember: who did it, how it is running, and what is configured. These services complement one another.","type":"mc"},{"id":32,"topic":3,"q":"How do GuardDuty and Inspector differ?","options":["GuardDuty detects threats; Inspector assesses supported workloads for vulnerabilities","GuardDuty patches applications; Inspector manages encryption keys","GuardDuty scans database schemas; Inspector filters web requests","GuardDuty manages certificates; Inspector investigates billing anomalies"],"correct":0,"a":"GuardDuty detects suspicious activity and threats; Inspector assesses supported workloads for software vulnerabilities and unintended network exposure.","why":"A threat finding and a vulnerable software package are different security problems.","type":"mc"},{"id":33,"topic":3,"q":"How do WAF and Shield differ?","options":["WAF filters web requests; Shield provides DDoS protection","WAF encrypts storage; Shield issues TLS certificates","WAF scans code packages; Shield manages IAM permissions","WAF backs up websites; Shield creates private subnets"],"correct":0,"a":"WAF filters supported web requests using application-layer rules; Shield provides DDoS protection.","why":"Use WAF for patterns such as SQL injection. Security groups control network traffic and do not replace web request inspection.","type":"mc"},{"id":34,"topic":3,"q":"What do Macie and Security Hub help with?","options":["Macie discovers sensitive S3 data; Security Hub centralizes security information","Macie manages TLS certificates; Security Hub distributes DNS records","Macie patches EC2 instances; Security Hub stores application secrets","Macie blocks IP addresses; Security Hub supplies dedicated HSMs"],"correct":0,"a":"Macie discovers sensitive data in S3; Security Hub helps centralize security posture information and findings.","why":"Sensitive-data discovery and cross-service security visibility are distinct from blocking individual network connections.","type":"mc"},{"id":35,"topic":3,"q":"How would you alert when EC2 CPU stays above a threshold?","options":["A CloudWatch CPU alarm with an evaluation period and configured notification/action","A CloudTrail event-history query with an S3 lifecycle rule","An AWS Config tag rule with a Route 53 health check","A Cost Explorer forecast with an EC2 Reserved Instance purchase"],"correct":0,"a":"Create a CloudWatch alarm on the CPU metric with a threshold and evaluation period, then configure a notification or supported action.","why":"The metric is the measurement, the alarm evaluates it, and a service such as SNS can deliver the notification.","type":"mc"},{"id":36,"topic":3,"q":"Are EC2 memory and disk-space measurements automatically included in default instance metrics?","options":["No; guest memory and filesystem free space usually require an agent or custom metrics","Yes; every operating-system metric is included automatically in default monitoring","Yes; CloudTrail records memory and filesystem use every second","No; AWS services cannot collect guest operating-system measurements"],"correct":0,"a":"No. Guest OS measurements such as memory usage and filesystem free space usually need the CloudWatch agent or custom metrics.","why":"Default EC2 monitoring and data collected from inside the operating system are different sources.","type":"mc"},{"id":37,"topic":3,"q":"How do Trusted Advisor and Compute Optimizer differ?","options":["Trusted Advisor offers broad checks; Compute Optimizer recommends resource configurations","Trusted Advisor reserves capacity; Compute Optimizer provisions IAM identities","Trusted Advisor stores traces; Compute Optimizer audits API calls","Trusted Advisor patches systems; Compute Optimizer rotates encryption keys"],"correct":0,"a":"Trusted Advisor gives broader best-practice recommendations; Compute Optimizer uses utilization data to recommend suitable resource configurations.","why":"Use broad environment checks versus resource-rightsizing analysis. Available checks and features depend on the service and support entitlement.","type":"mc"},{"id":38,"topic":3,"q":"How does AWS Health differ from CloudWatch?","options":["AWS Health reports service events; CloudWatch monitors workload telemetry","AWS Health monitors SQL queries; CloudWatch reports only AWS outages","AWS Health records API identities; CloudWatch lists compliance agreements","AWS Health calculates invoices; CloudWatch provides support-plan upgrades"],"correct":0,"a":"AWS Health reports AWS service events, including events relevant to your resources; CloudWatch observes your workload's metrics and logs.","why":"An AWS service event and an application-specific failure are not necessarily the same incident.","type":"mc"},{"id":39,"topic":3,"q":"What does AWS Systems Manager help operators do?","options":["Managing supported nodes, commands, automation, inventory, and patching","Registering public domains and distributing DNS changes","Storing objects and moving them automatically between S3 classes","Purchasing third-party software and negotiating license agreements"],"correct":0,"a":"Manage supported nodes, automate operational tasks, run commands, and coordinate patching and inventory.","why":"Management requires suitable permissions, connectivity, and configuration. It does not eliminate customer responsibility for operating-system maintenance.","type":"mc"},{"id":40,"topic":3,"q":"How do Control Tower and Service Catalog differ?","options":["Control Tower governs a landing zone; Service Catalog offers approved products","Control Tower distributes content; Service Catalog registers domain names","Control Tower runs containers; Service Catalog stores their image layers","Control Tower forecasts costs; Service Catalog controls physical data centers"],"correct":0,"a":"Control Tower helps establish and govern a multi-account landing zone; Service Catalog distributes approved products for controlled deployment.","why":"Control Tower concerns the account environment. Service Catalog concerns what users are approved to provision.","type":"mc"},{"id":41,"topic":4,"q":"What are the scopes of a VPC and a subnet?","options":["A VPC is Regional; a subnet belongs to one Availability Zone","A VPC is global; each subnet spans every AWS Region","A VPC belongs to one AZ; each subnet spans the Region","A VPC belongs to an edge location; a subnet belongs to an account"],"correct":0,"a":"A VPC belongs to one Region; each subnet belongs to one Availability Zone.","why":"Use multiple subnets across AZs for an architecture that spans failure domains.","type":"mc"},{"id":42,"topic":4,"q":"What makes a subnet public, and what else does an instance need for public IPv4 access?","options":["Internet-gateway route, appropriate public address, and permitting security rules","A public name tag alone; AWS creates all needed access automatically","A NAT gateway alone; instances never need routes or security rules","A private address alone; an internet gateway translates every private address"],"correct":0,"a":"A public subnet has a route to an internet gateway. The instance also needs an appropriate public address and security rules permitting the traffic.","why":"A route alone does not make every resource reachable. Addressing and traffic controls still apply.","type":"mc"},{"id":43,"topic":4,"q":"How can private instances initiate internet access without accepting unsolicited inbound connections?","options":["A correctly routed public NAT gateway for outbound IPv4 traffic","An inbound ALB that automatically translates all outbound private traffic","An IAM role that assigns each connection a public IPv4 address","An S3 gateway endpoint that forwards arbitrary internet traffic"],"correct":0,"a":"Use a correctly routed public NAT gateway for outbound IPv4 access, together with the required internet-gateway route.","why":"NAT enables initiated outbound connections; it is not a way to publish a private application for inbound users.","type":"mc"},{"id":44,"topic":4,"q":"How do security groups and network ACLs differ?","options":["Security groups: stateful allow rules; NACLs: stateless allow/deny subnet rules","Security groups: stateless deny rules; NACLs: stateful allow-only instance rules","Security groups: DNS rules; NACLs: IAM permission rules","Security groups: routing tables; NACLs: certificate-validation rules"],"correct":0,"a":"Security groups are stateful allow-rule filters associated with resources/network interfaces; network ACLs are stateless subnet filters with allow and deny rules.","why":"With stateless ACLs, return traffic needs appropriate rules too. Security groups automatically track permitted connections.","type":"mc"},{"id":45,"topic":4,"q":"What is a VPC endpoint used for?","options":["Private connectivity to supported services without requiring a public-internet path","Public IP addresses for every instance in the VPC","Automatic peering with every VPC in the same Region","An internet gateway that encrypts every outbound connection"],"correct":0,"a":"Private connectivity from a VPC to supported services without requiring the public-internet path.","why":"Gateway endpoints support S3 and DynamoDB; interface endpoints use AWS PrivateLink for supported services. Endpoint type and service determine pricing and behavior.","type":"mc"},{"id":46,"topic":4,"q":"What does Route 53 do?","options":["DNS, domain registration, health checks, and DNS routing policies","Hosting application source code and executing functions","Distributing software patches to operating systems","Managing certificates and renewing database encryption keys"],"correct":0,"a":"DNS, domain registration, health checks, and DNS routing policies such as latency or failover routing.","why":"DNS resolves names to endpoints; Route 53 does not host your application's code.","type":"mc"},{"id":47,"topic":4,"q":"What does CloudFront do?","options":["Content delivery through an edge network that can cache eligible content","Authoritative DNS and domain-registration management","Private dedicated connectivity to an on-premises network","A managed relational database for global transactions"],"correct":0,"a":"Cache and deliver content through a global edge network, reducing viewer latency and load on origins.","why":"CloudFront is content delivery. Route 53 answers DNS queries. Dynamic content and caching behavior depend on configuration.","type":"mc"},{"id":48,"topic":4,"q":"How do Site-to-Site VPN and Direct Connect differ?","options":["VPN uses encrypted IPsec tunnels; Direct Connect provides dedicated connectivity","VPN uses dedicated fiber only; Direct Connect always provides IPsec encryption","VPN creates DNS zones; Direct Connect caches content at edge locations","VPN requires AWS-owned offices; Direct Connect requires public application endpoints"],"correct":0,"a":"Site-to-Site VPN uses encrypted IPsec tunnels; Direct Connect provides dedicated connectivity between your network and AWS.","why":"Direct Connect is not automatically encrypted end to end. Add an appropriate encryption design when required.","type":"mc"},{"id":49,"topic":4,"q":"How do VPC peering and Transit Gateway differ?","options":["Peering connects VPCs directly without transitive routing; Transit Gateway is a routing hub","Peering is transitive by default; Transit Gateway connects only two VPCs","Peering encrypts objects; Transit Gateway issues certificates","Peering balances HTTP requests; Transit Gateway scales application workers"],"correct":0,"a":"Peering connects VPCs directly and is non-transitive; Transit Gateway acts as a routing hub for multiple VPCs and connected networks.","why":"A hub simplifies larger topologies. Routing and permitted address ranges still need deliberate design.","type":"mc"},{"id":50,"topic":4,"q":"When should you choose an ALB versus an NLB?","options":["ALB for HTTP host/path routing; NLB for transport-level connection handling","ALB for persistent disks; NLB for object storage","ALB for DNS registration; NLB for CDN caching","ALB for transport-only routing; NLB for HTTP path-based routing"],"correct":0,"a":"ALB for HTTP/HTTPS features such as host/path routing; NLB for transport-level TCP/UDP/TLS traffic and high-performance connection handling.","why":"A load balancer distributes traffic to targets. It does not itself add EC2 instances; Auto Scaling handles capacity.","type":"mc"},{"id":51,"topic":5,"q":"What do EC2, an AMI, and an instance type each specify?","options":["EC2 runs servers; AMI supplies image configuration; instance type defines resource balance","EC2 stores images; AMI sets billing discounts; instance type sets IAM permissions","EC2 runs databases only; AMI supplies DNS; instance type selects a support plan","EC2 issues credentials; AMI defines subnets; instance type manages encryption"],"correct":0,"a":"EC2 runs virtual servers; an AMI supplies launch-image software configuration; the instance type specifies a balance of CPU, memory, storage, and networking.","why":"Choose the image for the operating system/software and the type for workload requirements. Neither is a complete backup strategy by itself.","type":"mc"},{"id":52,"topic":5,"q":"How do EC2 stop and terminate differ for an EBS-backed instance?","options":["Stop is restartable; terminate removes the instance; EBS retention depends on settings","Stop deletes all EBS volumes; terminate preserves the instance for later restart","Stop and terminate both suspend the same restartable instance indefinitely","Stop preserves compute billing; terminate guarantees all allocated resources are free"],"correct":0,"a":"Stopping powers down a restartable instance; termination removes it. EBS volume retention on termination depends on delete-on-termination settings.","why":"Stopped compute can stop accruing instance usage charges, but retained storage and other allocated resources can still cost money.","type":"mc"},{"id":53,"topic":5,"q":"How does an EC2 Auto Scaling group respond to demand and unhealthy instances?","options":["It maintains capacity, replaces unhealthy instances, and applies scaling policies","It changes DNS registration and automatically rewrites application code","It automatically converts every instance to a Dedicated Host","It guarantees zero downtime without a multi-AZ application design"],"correct":0,"a":"It maintains configured capacity, replaces unhealthy instances, and can change capacity according to scaling policies or schedules.","why":"Set appropriate minimum, desired, and maximum capacity. Auto Scaling improves availability only when the surrounding architecture is also resilient.","type":"mc"},{"id":54,"topic":5,"q":"When is Lambda a good fit?","options":["Event-driven code execution without managing underlying servers","Work requiring direct control of the physical host and hypervisor","A shared NFS filesystem for persistent application files","A replacement for configuring application permissions and dependencies"],"correct":0,"a":"Event-driven code execution without managing servers, such as processing an uploaded object or handling an API request.","why":"Customers still manage code, permissions, dependencies, and limits. Serverless means the provider manages servers, not that no servers exist.","type":"mc"},{"id":55,"topic":5,"q":"Can a mobile or web application invoke Lambda?","options":["Yes, through authorized calls or integrations such as API Gateway","No, only EC2 instances can invoke Lambda functions","No, functions can run only from scheduled AWS maintenance events","Yes, but only if the application uses root access keys"],"correct":0,"a":"Yes, through authorized API calls or an integration such as API Gateway. AWS services can also trigger functions.","why":"The old claim that mobile applications cannot invoke Lambda is false. Authentication and authorization must still be configured.","type":"mc"},{"id":56,"topic":5,"q":"How do ECS, EKS, Fargate, and ECR differ?","options":["ECS/EKS: orchestration; Fargate: container compute; ECR: image storage","ECS/EKS: image storage; Fargate: DNS; ECR: orchestration","ECS/EKS: databases; Fargate: object storage; ECR: file sharing","ECS/EKS: certificates; Fargate: source control; ECR: billing"],"correct":0,"a":"ECS orchestrates containers; EKS provides managed Kubernetes; Fargate supplies serverless container compute; ECR stores container images.","why":"Orchestration, compute capacity, and image storage solve different parts of running containers.","type":"mc"},{"id":57,"topic":5,"q":"How do Elastic Beanstalk and CloudFormation differ?","options":["Beanstalk manages application deployment; CloudFormation provisions infrastructure templates","Beanstalk supplies DNS; CloudFormation provides CDN caching","Beanstalk stores backups; CloudFormation schedules data retention","Beanstalk audits API calls; CloudFormation detects security threats"],"correct":0,"a":"Beanstalk deploys applications on supported platforms and manages the environment; CloudFormation provisions infrastructure from templates.","why":"Beanstalk focuses on application deployment. CloudFormation makes resource definitions repeatable and reviewable.","type":"mc"},{"id":58,"topic":5,"q":"Why use infrastructure as code?","options":["Consistent definitions, versioned changes, repeatable deployments, and recreation","Removing the need to review infrastructure changes before deployment","Ensuring every template is secure merely because it is written as code","Converting every infrastructure resource into a free service"],"correct":0,"a":"To define infrastructure consistently, version changes, automate deployment, and recreate environments.","why":"Automation reduces manual inconsistency but can reproduce mistakes too. Review and test templates before important changes.","type":"mc"},{"id":59,"topic":5,"q":"How do CodeBuild, CodeDeploy, and CodePipeline differ?","options":["CodeBuild builds/tests; CodeDeploy deploys; CodePipeline coordinates stages","CodeBuild deploys; CodeDeploy stores images; CodePipeline registers domains","CodeBuild audits; CodeDeploy encrypts; CodePipeline creates database schemas","CodeBuild provisions DNS; CodeDeploy routes events; CodePipeline patches kernels"],"correct":0,"a":"CodeBuild builds and tests; CodeDeploy automates deployments; CodePipeline coordinates delivery stages.","why":"Build, deploy, and orchestrate are separate jobs. A pipeline can use different supported source providers and tools.","type":"mc"},{"id":60,"topic":5,"q":"When should you choose EC2, containers, or Lambda?","options":["EC2 for OS control; containers for packaged apps; Lambda for suitable event-driven functions","EC2 for object storage; containers for DNS; Lambda for block volumes","EC2 for zero OS control; containers for IAM users; Lambda for physical licensing","EC2, containers, and Lambda have identical operating models and constraints"],"correct":0,"a":"EC2 for OS-level control; containers for packaged applications with orchestration; Lambda for event-driven functions that fit its execution model.","why":"Start with operational control, execution pattern, and workload constraints rather than assuming one compute option always costs least.","type":"mc"},{"id":61,"topic":6,"q":"How do S3, EBS, EFS, and instance store differ?","options":["S3: objects; EBS: blocks; EFS: shared files; instance store: temporary local storage","S3: blocks; EBS: shared files; EFS: objects; instance store: permanent backups","S3: shared files; EBS: objects; EFS: local disks; instance store: regional replication","S3: temporary disks; EBS: DNS; EFS: containers; instance store: databases"],"correct":0,"a":"S3 is object storage; EBS is persistent block storage; EFS is shared file storage; instance store is temporary host-attached storage.","why":"Choose by access model and durability needs. A bucket, disk volume, shared filesystem, and temporary disk are not interchangeable.","type":"mc"},{"id":62,"topic":6,"q":"Where is an EBS volume located, and can multiple EC2 instances attach to it?","options":["One AZ; supported io1/io2 Multi-Attach can serve eligible instances in that AZ","Multiple Regions; every EBS volume automatically attaches across Regions","One AZ; no EBS volume can ever attach to more than one instance","Global; all volume types support unlimited simultaneous attachments"],"correct":0,"a":"An EBS volume is AZ-scoped. Supported io1/io2 volumes can use Multi-Attach with eligible instances in the same AZ.","why":"Multi-Attach needs supported configuration and software that coordinates concurrent writes. The blanket statement that EBS can never attach to multiple instances is wrong.","type":"mc"},{"id":63,"topic":6,"q":"What is an EBS snapshot used for?","options":["A point-in-time backup used to restore a volume or copy backup data","A live volume that automatically shares writes with its original volume","An AMI replacement that guarantees application-consistent backups without coordination","A network endpoint that exposes a volume to every Availability Zone"],"correct":0,"a":"A point-in-time backup that can restore a volume; snapshots can be copied for other Regions when needed.","why":"A snapshot is not a live volume or automatic application-consistent backup. Coordinate application writes where required.","type":"mc"},{"id":64,"topic":6,"q":"How does S3 versioning help recover data?","options":["It retains object versions for recovery from eligible overwrites or deletions","It prevents every user, including administrators, from ever deleting any version","It copies every object automatically to all AWS Regions","It eliminates storage charges for all previous versions of objects"],"correct":0,"a":"It keeps multiple object versions, allowing recovery from accidental overwrite or deletion when the needed versions remain available.","why":"Versioning consumes storage and does not replace permission controls or retention policies. A delete marker differs from permanent deletion of a version.","type":"mc"},{"id":65,"topic":6,"q":"How do S3 access controls and encryption work together?","options":["Access controls govern access; encryption protects content; new uploads are encrypted by default","Encryption makes every bucket private regardless of its access policies","Block Public Access encrypts objects but has no effect on access","Default encryption gives every AWS account permission to read objects"],"correct":0,"a":"Access policies and Block Public Access help control who can reach objects; encryption protects stored or transmitted content.","why":"S3 encrypts new object uploads at rest by default. Encryption alone does not make an overly permissive bucket private.","type":"mc"},{"id":66,"topic":6,"q":"How should you choose between S3 Standard, Standard-IA, and Intelligent-Tiering?","options":["Standard: frequent; Standard-IA: infrequent immediate reads; Intelligent-Tiering: changing access","Standard: archive restore; Standard-IA: temporary disks; Intelligent-Tiering: public hosting only","Standard: single-AZ; Standard-IA: compute; Intelligent-Tiering: DNS routing","Standard: cheapest for all data; Standard-IA: no retrieval costs; Intelligent-Tiering: fixed access"],"correct":0,"a":"Standard for frequent access; Standard-IA for infrequent access with immediate retrieval; Intelligent-Tiering for changing or uncertain access patterns.","why":"Consider retrieval fees, monitoring charges, minimum storage duration, and object size. Lowest storage price does not always mean lowest total cost.","type":"mc"},{"id":67,"topic":6,"q":"How do the S3 Glacier storage classes differ?","options":["Instant Retrieval gives immediate access; Flexible Retrieval and Deep Archive use restore workflows","Every Glacier class requires the same twelve-hour restore before any access","Every Glacier class provides identical immediate retrieval and pricing","Deep Archive is temporary storage; Instant Retrieval requires the longest restore"],"correct":0,"a":"Glacier Instant Retrieval provides immediate access; Glacier Flexible Retrieval and Deep Archive use restore workflows with different retrieval times and costs.","why":"Archive is a storage-class choice, not a guarantee of immediate access. Choose from the required recovery time and retention pattern.","type":"mc"},{"id":68,"topic":6,"q":"What is the resilience tradeoff with S3 One Zone-IA and S3 Express One Zone?","options":["They store data in one AZ; select them only if the resilience design accepts that scope","They replicate data automatically to every AWS Region","They guarantee continued access after loss of the storage AZ without recovery planning","They are multi-AZ classes that differ only in object naming conventions"],"correct":0,"a":"They store data in one AZ, unlike multi-AZ S3 storage classes. One Zone-IA targets infrequent access; Express One Zone targets low-latency access.","why":"Use single-AZ classes only when the workload's resilience and recovery design accepts that failure domain.","type":"mc"},{"id":69,"topic":6,"q":"How do S3 lifecycle rules and replication differ?","options":["Lifecycle transitions/expires eligible objects; replication copies eligible objects to another bucket","Lifecycle copies objects between accounts; replication deletes them on a schedule","Lifecycle grants permissions; replication encrypts only in transit","Lifecycle changes DNS; replication resizes compute instances"],"correct":0,"a":"Lifecycle rules transition or expire eligible objects; replication copies eligible objects to another bucket under configured rules.","why":"Lifecycle manages age/access-related storage decisions. Replication supports a separate copy; neither automatically replaces all backup and recovery controls.","type":"mc"},{"id":70,"topic":6,"q":"When should you use EFS, FSx for Windows File Server, or FSx for Lustre?","options":["EFS: shared NFS; FSx Windows: Windows/SMB; FSx Lustre: parallel high-performance files","EFS: object storage; FSx Windows: DNS; FSx Lustre: cold archives","EFS: Windows-only SMB; FSx Windows: Linux block devices; FSx Lustre: IAM policies","EFS: temporary disks; FSx Windows: containers; FSx Lustre: database joins"],"correct":0,"a":"EFS for managed shared NFS-style access; FSx for Windows for native Windows/SMB needs; FSx for Lustre for high-performance parallel file workloads.","why":"Choose filesystem compatibility and workload behavior rather than choosing all file storage as if it were the same service.","type":"mc"},{"id":71,"topic":7,"q":"When should you use a relational database rather than DynamoDB?","options":["Relational for SQL, joins, and relational modeling; DynamoDB for key-value/document access patterns","Relational only for images; DynamoDB only for executable application code","Relational for DNS routing; DynamoDB for operating-system file sharing","Relational and DynamoDB use the same schema and query model in all cases"],"correct":0,"a":"Use relational databases for relational modeling, joins, and SQL transactions; use DynamoDB for key-value/document workloads designed around access patterns.","why":"Database choice follows query patterns and requirements, not simply whether the data is important or large.","type":"mc"},{"id":72,"topic":7,"q":"What does RDS manage, and what remains your responsibility?","options":["RDS manages infrastructure/maintenance; customers manage data, schema, queries, and access","RDS manages business logic; customers replace the physical database hardware","RDS grants all users access; customers maintain the AWS hypervisor","RDS designs all queries; customers patch the physical storage firmware"],"correct":0,"a":"RDS manages infrastructure and supported database maintenance, backups, and patching; you manage data, schemas, queries, access, and appropriate settings.","why":"Managed does not mean the provider designs efficient queries or decides which users should see your data.","type":"mc"},{"id":73,"topic":7,"q":"How do RDS Multi-AZ and read replicas differ?","options":["Multi-AZ targets availability; read replicas target read scaling; cluster and instance standby behavior differs","Multi-AZ always provides a single unreadable standby in every deployment type","Read replicas replace all backups and guarantee zero data loss","Multi-AZ increases write throughput by sharing one disk across all Regions"],"correct":0,"a":"Multi-AZ provides availability and failover; read replicas primarily offload reads. A classic Multi-AZ DB instance has a non-readable standby, while a Multi-AZ DB cluster has readable instances.","why":"The old absolute claim that every Multi-AZ deployment has an unreadable standby is incomplete. Identify the deployment type.","type":"mc"},{"id":74,"topic":7,"q":"What is Amazon Aurora, and does it always scale compute automatically?","options":["A MySQL/PostgreSQL-compatible relational database; compute scaling depends on configuration","A key-value database whose compute always scales without any configuration","An object-storage class that automatically migrates all database schemas","An in-memory cache whose data cannot be stored persistently"],"correct":0,"a":"Aurora is a relational database compatible with MySQL or PostgreSQL. Compute scaling behavior depends on its provisioned or serverless configuration.","why":"Storage scaling and compute scaling are different. Do not assume every Aurora deployment automatically adjusts all resources.","type":"mc"},{"id":75,"topic":7,"q":"What does DynamoDB provide, and what are global tables for?","options":["Managed key-value/document storage; global tables replicate across selected Regions","Managed relational joins; global tables convert every query into SQL","Shared block volumes; global tables mount a disk across every instance","Data warehousing only; global tables archive data with delayed retrieval"],"correct":0,"a":"Managed key-value/document storage with scaling options; global tables replicate tables across selected Regions.","why":"Choose keys and access patterns carefully. Multi-Region replication does not remove the need to understand the selected consistency mode and conflict behavior.","type":"mc"},{"id":76,"topic":7,"q":"How do Redshift and Athena differ?","options":["Redshift is a data warehouse; Athena queries supported sources, commonly S3, using SQL","Redshift stores container images; Athena deploys managed application platforms","Redshift handles DNS; Athena delivers content through edge locations","Redshift is a transactional key-value store; Athena is a Windows filesystem"],"correct":0,"a":"Redshift is a data warehouse for analytics; Athena runs SQL queries over supported data sources, commonly data in S3, without managing query servers.","why":"Both support analytics, but they differ in data organization, execution model, and workload fit.","type":"mc"},{"id":77,"topic":7,"q":"Why place ElastiCache in front of a database?","options":["Serve repeated reads from memory to reduce database load and latency","Guarantee that every cached value is permanently durable and always current","Eliminate all database queries, including every write transaction","Automatically migrate a relational database into an object-storage bucket"],"correct":0,"a":"To serve repeated reads from in-memory data and reduce database load and response time.","why":"Caching introduces expiration, invalidation, and consistency decisions. A cache is not automatically the authoritative durable database.","type":"mc"},{"id":78,"topic":7,"q":"How do backups, point-in-time recovery, and replicas address different risks?","options":["Backups preserve recovery copies; PITR restores an earlier point; replicas support availability/read capacity","Backups distribute live requests; PITR changes instance size; replicas replace every recovery plan","Backups prevent bad writes; PITR prevents deletion; replicas cannot copy mistakes","Backups and replicas both guarantee recovery to any date with no retention limits"],"correct":0,"a":"Backups preserve recoverable data; point-in-time recovery restores to an eligible earlier time; replicas support availability or read capacity.","why":"Replication can also copy a bad change. Test recovery and define retention instead of treating a replica as the entire backup strategy.","type":"mc"},{"id":79,"topic":7,"q":"What is AWS DMS used for?","options":["Migrating databases and replicating supported changes to reduce migration disruption","Moving only virtual-machine images while ignoring database contents","Replacing all schema-conversion work and guaranteeing zero downtime","Converting every data source automatically into a relational schema"],"correct":0,"a":"Database migration and supported ongoing replication, including change data capture to reduce migration disruption.","why":"Schema conversion and compatibility need planning. Replication reduces cutover work but does not guarantee zero downtime.","type":"mc"},{"id":80,"topic":7,"q":"Which specialized databases fit graph and document use cases?","options":["Neptune for graph relationships; DocumentDB for supported MongoDB-compatible documents","Neptune for Windows file shares; DocumentDB for block volumes","Neptune for object archives; DocumentDB for DNS records","Neptune for container images; DocumentDB for HTTP load balancing"],"correct":0,"a":"Neptune for connected graph data; DocumentDB for supported MongoDB-compatible document workloads.","why":"Compatibility is not identity with every upstream feature. Verify the required queries, versions, and semantics before migration.","type":"mc"},{"id":81,"topic":8,"q":"What are the six Well-Architected pillars?","options":["Operational excellence, security, reliability, performance efficiency, cost optimization, sustainability","Business, People, Governance, Platform, Security, Operations","Compute, storage, database, networking, migration, analytics","Availability, encryption, backups, monitoring, scaling, billing"],"correct":0,"a":"Operational excellence, security, reliability, performance efficiency, cost optimization, and sustainability.","why":"Use the pillars to evaluate tradeoffs, not as six separate products. Sustainability is part of the current framework.","type":"mc"},{"id":82,"topic":8,"q":"How do high availability, fault tolerance, and disaster recovery differ?","options":["HA minimizes interruption; fault tolerance continues through specified failures; DR restores after disruption","HA stores invoices; fault tolerance enforces IAM; DR balances requests","HA guarantees no failures; fault tolerance eliminates backups; DR prevents every outage","HA and DR both mean adding more CPU to one server"],"correct":0,"a":"High availability minimizes interruption; fault tolerance continues through specified failures; disaster recovery restores service after a serious disruption.","why":"They depend on design and tested recovery procedures. No deployment pattern guarantees zero downtime for every failure.","type":"mc"},{"id":83,"topic":8,"q":"How do Multi-AZ and Multi-Region designs address different failures?","options":["Multi-AZ addresses AZ failures; Multi-Region can address regional disruption","Multi-AZ addresses global DNS only; Multi-Region addresses a single disk failure only","Multi-AZ and Multi-Region are equivalent names for one deployment","Multi-Region removes all replication, failover, and consistency decisions"],"correct":0,"a":"Multi-AZ protects against an AZ-level outage; Multi-Region can address a regional disruption and geographic requirements.","why":"Cross-Region design adds cost, replication, consistency, and failover complexity. Choose it when the business requirements justify it.","type":"mc"},{"id":84,"topic":8,"q":"What do RTO and RPO measure?","options":["RTO: target recovery time; RPO: acceptable data-loss window","RTO: acceptable data-loss window; RPO: target recovery time","RTO: monthly availability percentage; RPO: annual support cost","RTO: number of backup copies; RPO: number of running servers"],"correct":0,"a":"RTO is the target recovery time; RPO is the acceptable data-loss window measured in time.","why":"A 15-minute RPO permits up to 15 minutes of lost changes; a one-hour RTO targets restoration within one hour.","type":"mc"},{"id":85,"topic":8,"q":"Why build loosely coupled, stateless application tiers?","options":["Reduce failure propagation and allow workers to be replaced or scaled more easily","Keep every user's only session copy in one worker's local memory","Require each tier to remain available before another tier can do any work","Store durable business data only on temporary instance disks"],"correct":0,"a":"Loose coupling limits failure propagation; stateless workers can be replaced or scaled without losing essential session data stored only on one worker.","why":"Put durable state in suitable shared stores and use messaging when work can be asynchronous.","type":"mc"},{"id":86,"topic":8,"q":"How do SQS, SNS, and EventBridge differ?","options":["SQS buffers work; SNS publishes to subscribers; EventBridge routes events","SQS registers domains; SNS creates databases; EventBridge stores disk snapshots","SQS caches web content; SNS scans code; EventBridge rotates keys","SQS provisions servers; SNS manages subnets; EventBridge patches systems"],"correct":0,"a":"SQS buffers messages for processing; SNS publishes messages to subscribers; EventBridge routes events using rules and integrations.","why":"Queue work, fan out notifications, and route events are distinct patterns that can be combined.","type":"mc"},{"id":87,"topic":8,"q":"How do SQS Standard and FIFO queues differ?","options":["Standard: at-least-once/best-effort order; FIFO: message-group order and deduplication features","Standard: exactly-once external side effects; FIFO: no ordering support","Standard: only one consumer globally; FIFO: public web hosting","Standard and FIFO both guarantee that consumer retries cannot cause duplicate side effects"],"correct":0,"a":"Standard queues favor high throughput with at-least-once delivery and best-effort ordering; FIFO supports ordered processing within message groups and deduplication features.","why":"Design consumers for retries and idempotency. FIFO features do not automatically make every external side effect exactly once.","type":"mc"},{"id":88,"topic":8,"q":"When should Step Functions be used?","options":["Coordinating multi-step workflows with branching, retries, and service integrations","Storing container images so ECS can download application layers","Providing a shared filesystem for parallel Linux processes","Replacing every task's compute service with a DNS routing policy"],"correct":0,"a":"To coordinate multi-step workflows, including branching, retries, and service integrations.","why":"It orchestrates work; the integrated services perform the actual tasks. This avoids hiding complex coordination in one large function.","type":"mc"},{"id":89,"topic":8,"q":"How does a resilient web application combine common AWS services?","options":["Load balancing, multi-AZ app capacity, scaling, resilient data, monitoring, tested backups","One large instance, local-only state, manual restarts, and no backup testing","A public database, root credentials in code, and unlimited inbound access","A CDN alone, without any origin redundancy or recovery design"],"correct":0,"a":"Use a load balancer, application capacity across AZs, appropriate Auto Scaling, a resilient database, monitoring, and tested backups.","why":"Each element addresses a distinct problem: routing, failure domains, capacity, data availability, detection, and recovery.","type":"mc"},{"id":90,"topic":8,"q":"How can cost optimization and sustainability reinforce each other?","options":["Right-size, remove idle resources, and match storage/scaling to measured demand","Keep every resource at maximum size to avoid measuring utilization","Replicate every workload into all Regions regardless of business needs","Retain every temporary dataset forever in the highest-performance storage class"],"correct":0,"a":"Right-size resources, remove idle capacity, choose efficient managed services where appropriate, and match storage and scaling to demand.","why":"Reducing unused resources can lower both spending and resource consumption. Measure the workload's actual needs rather than maximizing capacity by default.","type":"mc"},{"id":91,"topic":9,"q":"How do Application Migration Service, DMS, and DataSync differ?","options":["Application Migration Service: servers; DMS: databases; DataSync: file/object transfers","Application Migration Service: DNS; DMS: container images; DataSync: IAM roles","Application Migration Service: invoices; DMS: certificates; DataSync: dashboards","Application Migration Service: ML training; DMS: speech; DataSync: translations"],"correct":0,"a":"Application Migration Service migrates servers; DMS migrates databases; DataSync moves supported file/object data online.","why":"Choose by what must move. A database migration and a server lift-and-shift are not equivalent operations.","type":"mc"},{"id":92,"topic":9,"q":"What does Storage Gateway do in a hybrid environment?","options":["Connecting supported on-premises storage interfaces with AWS-backed storage","Replacing every hybrid network connection with public DNS","Automatically moving all compute instances into an on-premises data center","Converting local files into IAM permission policies"],"correct":0,"a":"Connects supported on-premises storage interfaces with AWS-backed storage.","why":"Storage Gateway provides ongoing hybrid access. A one-time bulk data movement job may be better served by a data-transfer tool.","type":"mc"},{"id":93,"topic":9,"q":"How do AWS Backup and Elastic Disaster Recovery differ?","options":["Backup manages backup policies; Elastic Disaster Recovery replicates servers for recovery","Backup balances live traffic; Elastic Disaster Recovery manages DNS registration","Backup runs containers; Elastic Disaster Recovery stores container images","Backup and Elastic Disaster Recovery are identical names for one service"],"correct":0,"a":"AWS Backup centrally manages backup policies for supported resources; Elastic Disaster Recovery replicates supported servers for recovery in AWS.","why":"Backups and recovery of running applications solve related but different problems. Test both restoration and recovery procedures.","type":"mc"},{"id":94,"topic":9,"q":"When should you use EMR, Glue, or AWS Batch?","options":["EMR: big-data frameworks; Glue: integration/cataloging; Batch: batch-job scheduling","EMR: DNS; Glue: block storage; Batch: identity federation","EMR: certificates; Glue: network routing; Batch: compliance agreements","EMR: web filtering; Glue: threat detection; Batch: account billing"],"correct":0,"a":"EMR for big-data frameworks such as Spark; Glue for data integration and cataloging; Batch for scheduling batch computing jobs.","why":"Data processing frameworks, data preparation, and job scheduling are different needs.","type":"mc"},{"id":95,"topic":9,"q":"How do streaming data processing and batch analytics differ?","options":["Streaming processes arriving events; batch processes accumulated data; Kinesis Data Streams supports streaming","Streaming processes only archived files; batch processes only live events","Streaming requires relational joins; batch requires public web endpoints","Streaming and batch differ only in the number of AWS accounts used"],"correct":0,"a":"Streaming processes incoming events continuously; batch processes accumulated datasets. Kinesis Data Streams is a streaming-data service; analytics tools can consume and analyze stored data.","why":"Choose based on latency, throughput, retention, and processing requirements, not simply whether the data contains numbers.","type":"mc"},{"id":96,"topic":9,"q":"Which services fit speech, text, and image tasks?","options":["Transcribe: speech→text; Polly: text→speech; Translate: languages; Comprehend: text; Rekognition: images/video","Transcribe: text→speech; Polly: speech→text; Translate: images; Comprehend: DNS; Rekognition: backups","Transcribe: languages; Polly: images; Translate: speech→text; Comprehend: keys; Rekognition: billing","Transcribe: images; Polly: languages; Translate: text→speech; Comprehend: storage; Rekognition: networking"],"correct":0,"a":"Transcribe: speech to text; Polly: text to speech; Translate: language translation; Comprehend: text analysis; Rekognition: image/video analysis.","why":"These are distinct capabilities. Match the input and desired output before choosing a service.","type":"mc"},{"id":97,"topic":9,"q":"How do Amazon Bedrock and SageMaker AI differ?","options":["Bedrock: managed foundation-model capabilities; SageMaker AI: build/train/deploy ML models","Bedrock: relational databases; SageMaker AI: managed Windows file storage","Bedrock: DNS management; SageMaker AI: HTTP request filtering","Bedrock: physical-host licensing; SageMaker AI: account consolidation"],"correct":0,"a":"Bedrock provides managed access to foundation models and generative-AI capabilities; SageMaker AI supports building, training, and deploying machine-learning models.","why":"Choose based on whether you need managed foundation-model use or a broader custom-model development workflow.","type":"mc"},{"id":98,"topic":9,"q":"What does API Gateway provide?","options":["Managed API endpoints with authorization, throttling, and backend integrations","A database engine that automatically writes application business logic","A shared filesystem that synchronizes every application instance","An operating system that patches all backend servers automatically"],"correct":0,"a":"Managed APIs that let clients access backend services through configured endpoints, authorization, throttling, and integrations.","why":"It exposes and manages an API; it is not the database or compute running the backend business logic.","type":"mc"},{"id":99,"topic":9,"q":"How do Outposts and Local Zones address location requirements?","options":["Outposts runs AWS infrastructure at customer sites; Local Zones place selected services near metro areas","Outposts caches public content; Local Zones register domain names","Outposts is a global IAM service; Local Zones are user permission groups","Outposts and Local Zones both mean a private subnet inside one AZ"],"correct":0,"a":"Outposts runs AWS infrastructure at customer sites; Local Zones place selected services closer to particular metropolitan areas.","why":"Both address location and latency needs but differ in placement, service availability, and operational model.","type":"mc"},{"id":100,"topic":9,"q":"What role does AWS Marketplace play?","options":["Finding, buying, and deploying eligible third-party software, data, and services","Managing physical hardware owned by every AWS customer","Guaranteeing every third-party product is free of licensing and usage charges","Replacing the need to evaluate product terms and compatibility"],"correct":0,"a":"It is a marketplace for finding, buying, and deploying eligible third-party software, data, and services.","why":"Marketplace is a procurement channel. Check product terms, compatibility, and underlying AWS resource charges separately.","type":"mc"},{"id":101,"topic":5,"q":"Which AWS service provides resizable virtual servers in the cloud?","options":["Amazon EC2","Amazon S3","Amazon Route 53","Amazon DynamoDB"],"correct":0,"a":"Amazon EC2","why":"EC2 supplies resizable virtual machines. S3 stores objects; Route 53 provides DNS; DynamoDB is a NoSQL database.","type":"mc"},{"id":102,"topic":6,"q":"Which AWS service stores files as objects inside buckets?","options":["Amazon EBS","Amazon S3","Amazon EFS","Amazon RDS"],"correct":1,"a":"Amazon S3","why":"S3 stores objects in buckets. EBS is block storage, EFS is file storage, and RDS is a relational database.","type":"mc"},{"id":103,"topic":5,"q":"Which AWS service runs code in response to events without managing servers?","options":["Amazon EC2","Amazon Lightsail","AWS Lambda","Amazon EKS"],"correct":2,"a":"AWS Lambda","why":"Lambda executes event-driven code without customer-managed servers. EC2 and Lightsail involve virtual-server resources; EKS manages Kubernetes.","type":"mc"},{"id":104,"topic":6,"q":"Which service provides a shared, elastic file system for Linux workloads?","options":["Amazon S3 Glacier","Amazon EBS","EC2 instance store","Amazon EFS"],"correct":3,"a":"Amazon EFS","why":"EFS supplies an elastic shared filesystem for Linux/NFS clients. EBS is a block device; instance store is temporary; Glacier is archival object storage.","type":"mc"},{"id":105,"topic":7,"q":"Which AWS service is a serverless NoSQL key-value database?","options":["Amazon DynamoDB","Amazon Redshift","Amazon Aurora","Amazon Neptune"],"correct":0,"a":"Amazon DynamoDB","why":"DynamoDB is a managed serverless key-value and document database. Aurora is relational; Redshift is analytical warehousing; Neptune is graph-oriented.","type":"mc"},{"id":106,"topic":4,"q":"Which AWS service speeds up content delivery through a global edge network?","options":["AWS Direct Connect","Amazon CloudFront","Amazon VPC","AWS Transit Gateway"],"correct":1,"a":"Amazon CloudFront","why":"CloudFront delivers content through edge locations near viewers. Direct Connect provides dedicated connectivity; VPC provides network isolation; Transit Gateway routes between networks.","type":"mc"},{"id":107,"topic":0,"q":"True or False: An Availability Zone exists within a single AWS Region.","options":["True","False"],"correct":0,"a":"True","why":"True. An Availability Zone is within one Region. Multiple AZs provide separate failure domains inside that Region.","type":"tf"},{"id":108,"topic":7,"q":"Which service manages common relational database administration tasks for online transaction processing (OLTP) systems?","options":["Amazon Athena","Amazon DynamoDB","Amazon RDS","Amazon Redshift"],"correct":2,"a":"Amazon RDS","why":"RDS takes on common relational database administration for transactional workloads. Redshift targets analytics; DynamoDB uses a NoSQL model; Athena runs analytical queries.","type":"mc"},{"id":109,"topic":4,"q":"Which AWS service provides Domain Name System (DNS) services?","options":["Amazon CloudWatch","AWS CloudTrail","Amazon CloudFront","Amazon Route 53"],"correct":3,"a":"Amazon Route 53","why":"Route 53 supplies DNS. CloudFront distributes content, while CloudWatch and CloudTrail serve monitoring and auditing roles.","type":"mc"},{"id":110,"topic":0,"q":"Which cloud benefit lets a team provision resources in minutes instead of waiting weeks?","options":["Increased speed and agility","Fixed capacity planning","Hardware ownership","Long-term procurement cycles"],"correct":0,"a":"Increased speed and agility","why":"Rapid provisioning improves speed and agility. It reduces the wait associated with procurement and hardware installation.","type":"mc"},{"id":111,"topic":0,"q":"Which cloud benefit replaces large upfront hardware purchases with usage-based spending?","options":["Global deployment","Trade fixed expense for variable expense","Fault isolation","Vertical scaling"],"correct":1,"a":"Trade fixed expense for variable expense","why":"Usage-based spending replaces large upfront hardware commitments with variable expense. This does not mean every cloud resource is free.","type":"mc"},{"id":112,"topic":0,"q":"A company uses a complete web application managed by its provider. Which model is this?","options":["Infrastructure as a Service (IaaS)","Platform as a Service (PaaS)","Software as a Service (SaaS)","On-premises computing"],"correct":2,"a":"Software as a Service (SaaS)","why":"SaaS is a finished application run by its provider. IaaS and PaaS leave more of the application stack under customer control.","type":"mc"},{"id":113,"topic":0,"q":"Which AWS CAF perspective includes cloud architecture, data, and application development?","options":["Business","Governance","People","Platform"],"correct":3,"a":"Platform","why":"The Platform perspective covers building the cloud platform, architecture, data, and applications. The other CAF perspectives address different organizational capabilities.","type":"mc"},{"id":114,"topic":0,"q":"True or False: Cloud elasticity includes reducing resources when demand falls.","options":["True","False"],"correct":0,"a":"True","why":"True. Elasticity includes scaling down as demand falls, not merely adding capacity during a spike.","type":"tf"},{"id":115,"topic":0,"q":"True or False: Using AWS requires customers to purchase physical servers first.","options":["True","False"],"correct":1,"a":"False","why":"False. Customers can provision cloud resources without first buying the provider’s physical servers.","type":"tf"},{"id":116,"topic":2,"q":"Which AWS service controls identities and their permissions to AWS resources?","options":["AWS Identity and Access Management (IAM)","Amazon GuardDuty","AWS Shield","Amazon Inspector"],"correct":0,"a":"AWS Identity and Access Management (IAM)","why":"IAM controls identities and permissions. GuardDuty detects threats, Shield addresses DDoS, and Inspector assesses vulnerabilities.","type":"mc"},{"id":117,"topic":2,"q":"Which AWS service creates and controls keys used to encrypt data?","options":["AWS Certificate Manager","AWS Key Management Service (AWS KMS)","AWS Secrets Manager","Amazon Macie"],"correct":1,"a":"AWS Key Management Service (AWS KMS)","why":"KMS manages cryptographic keys. ACM manages certificates; Secrets Manager stores application secrets; Macie discovers sensitive S3 data.","type":"mc"},{"id":118,"topic":3,"q":"Which service records AWS account activity and API events for auditing?","options":["Amazon CloudWatch","AWS Config","AWS CloudTrail","AWS Trusted Advisor"],"correct":2,"a":"AWS CloudTrail","why":"CloudTrail records account and API activity for an audit trail. CloudWatch tracks behavior; Config tracks resource configuration.","type":"mc"},{"id":119,"topic":3,"q":"Which service detects suspicious activity and potential threats in AWS accounts?","options":["AWS Artifact","AWS Audit Manager","AWS Certificate Manager","Amazon GuardDuty"],"correct":3,"a":"Amazon GuardDuty","why":"GuardDut
