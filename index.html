y detects suspicious activity from supported telemetry. Artifact provides reports, Audit Manager assists evidence collection, and ACM handles certificates.","type":"mc"},{"id":120,"topic":2,"q":"Where can customers download AWS compliance reports and agreements on demand?","options":["AWS Artifact","AWS Security Hub","Amazon Detective","AWS IAM Identity Center"],"correct":0,"a":"AWS Artifact","why":"Artifact supplies on-demand AWS compliance reports and agreements. Downloading them does not make a workload compliant by itself.","type":"mc"},{"id":121,"topic":2,"q":"True or False: AWS is responsible for securing its physical data centers.","options":["True","False"],"correct":0,"a":"True","why":"True. AWS is responsible for its facilities, hardware, and underlying infrastructure. Customers retain responsibility for their own data and configurations.","type":"tf"},{"id":122,"topic":2,"q":"True or False: The AWS account root user should be used for routine administration.","options":["True","False"],"correct":1,"a":"False","why":"False. Protect root access and use it only for tasks requiring root. Routine administration should use suitable non-root identities.","type":"tf"},{"id":123,"topic":1,"q":"Which tool estimates the cost of a planned AWS architecture before deployment?","options":["AWS Cost Explorer","AWS Pricing Calculator","AWS Budgets","AWS Cost and Usage Report"],"correct":1,"a":"AWS Pricing Calculator","why":"Pricing Calculator estimates the cost of a proposed architecture. Cost Explorer analyzes spend, Budgets tracks thresholds, and CUR supplies detailed billing records.","type":"mc"},{"id":124,"topic":1,"q":"Which AWS tool visualizes and analyzes historical cost and usage?","options":["AWS Pricing Calculator","AWS Organizations","AWS Cost Explorer","AWS Marketplace"],"correct":2,"a":"AWS Cost Explorer","why":"Cost Explorer visualizes historical usage and cost and can forecast spending. Calculator is primarily for planning proposed configurations.","type":"mc"},{"id":125,"topic":1,"q":"Which AWS tool can alert a customer when spending exceeds a chosen threshold?","options":["AWS Artifact","AWS Service Catalog","AWS Compute Optimizer","AWS Budgets"],"correct":3,"a":"AWS Budgets","why":"Budgets can notify when actual or forecast spending reaches configured thresholds. An alert alone does not stop all spending.","type":"mc"},{"id":126,"topic":0,"q":"An existing ticketing app adds compute capacity for a high-demand concert launch. This demonstrates...","options":["Elasticity","Durability","Data sovereignty","Dedicated tenancy"],"correct":0,"a":"Elasticity","why":"Adding capacity to match a demand spike is elasticity; capacity can later be reduced. Durability concerns preserving data.","type":"mc"},{"id":127,"topic":0,"q":"A customer moves an app from IaaS to PaaS. How do its operational responsibilities change?","options":["The customer assumes responsibility for AWS facilities","The provider manages more of the platform beneath the application","The customer must purchase and install physical servers","The provider becomes responsible for the customer's application data"],"correct":1,"a":"The provider manages more of the platform beneath the application","why":"PaaS shifts more platform management to the provider. The customer still manages its application and data-access decisions.","type":"mc"},{"id":128,"topic":0,"q":"A cloud team defines monitoring, incident response, and daily support processes. Which CAF perspective applies?","options":["Business","Governance","Operations","Platform"],"correct":2,"a":"Operations","why":"Operations includes monitoring, incident response, service delivery, and support processes. Platform focuses on the technical environment.","type":"mc"},{"id":129,"topic":8,"q":"An architect wants a guided review of a workload against AWS design best practices. Which service helps?","options":["AWS Trusted Advisor","AWS Config","AWS Systems Manager","AWS Well-Architected Tool"],"correct":3,"a":"AWS Well-Architected Tool","why":"The Well-Architected Tool guides a workload review using the framework and tracks identified risks. Trusted Advisor offers recommendations but is not this interactive assessment process.","type":"mc"},{"id":130,"topic":0,"q":"Why can a large cloud provider often offer lower per-unit infrastructure costs?","options":["It aggregates demand from many customers to achieve economies of scale","It requires every customer to reserve maximum capacity","It transfers all software licensing to customers","It operates only one data center worldwide"],"correct":0,"a":"It aggregates demand from many customers to achieve economies of scale","why":"Aggregated demand gives providers economies of scale, spreading infrastructure costs across many customers.","type":"mc"},{"id":131,"topic":1,"q":"Which costs belong in the Total Cost of Ownership (TCO) of an on-premises server environment?","options":["Only the original server purchase price","Facilities, power, support contracts, and software licenses","Only internet bandwidth used by customers","Only the resale value of retired equipment"],"correct":1,"a":"Facilities, power, support contracts, and software licenses","why":"TCO includes facilities, electricity, maintenance/support, software, staff effort, and hardware—not just the purchase price.","type":"mc"},{"id":132,"topic":7,"q":"A team adopts Amazon RDS to reduce database administration. Which responsibility cannot be delegated to AWS?","options":["Securing the physical database host","Replacing failed storage hardware","Managing database users and access to company data","Maintaining power and cooling in AWS facilities"],"correct":2,"a":"Managing database users and access to company data","why":"Customers still decide who may access their company data. AWS maintains facilities and hardware and takes on more platform maintenance in RDS.","type":"mc"},{"id":133,"topic":2,"q":"A developer needs read access to one S3 bucket only. Which IAM approach is best?","options":["Grant AdministratorAccess temporarily","Permit all S3 actions on every bucket","Share the account root user credentials","Grant only the required read actions on that bucket"],"correct":3,"a":"Grant only the required read actions on that bucket","why":"Least privilege grants the required actions on the intended resources. Root sharing and broad administrator/S3 permissions exceed the request.","type":"mc"},{"id":134,"topic":2,"q":"An external auditor needs temporary read access to an AWS account. What should the company provide?","options":["An IAM role the auditor can assume","The root user's access keys","A shared IAM user's permanent access keys","An Amazon Cognito user pool administrator"],"correct":0,"a":"An IAM role the auditor can assume","why":"An assumable IAM role provides temporary credentials for an authorized auditor. Permanent shared keys and root credentials create unnecessary risk.","type":"mc"},{"id":135,"topic":3,"q":"A security team must discover sensitive personal data stored in S3. Which service should it use?","options":["Amazon Inspector","Amazon Macie","AWS Shield","AWS CloudTrail"],"correct":1,"a":"Amazon Macie","why":"Macie discovers sensitive data in S3. Inspector scans vulnerabilities; Shield addresses DDoS; CloudTrail records account activity.","type":"mc"},{"id":136,"topic":3,"q":"Which service scans EC2 instances, ECR container images, and Lambda functions for vulnerabilities?","options":["Amazon GuardDuty","Amazon Detective","Amazon Inspector","AWS Artifact"],"correct":2,"a":"Amazon Inspector","why":"Inspector assesses supported EC2, ECR, and Lambda workloads for vulnerabilities. GuardDuty detects suspicious behavior; Artifact supplies compliance documents.","type":"mc"},{"id":137,"topic":3,"q":"An auditor needs resource configuration history and compliance-rule results. Which service fits?","options":["Amazon CloudWatch","AWS CloudTrail","AWS Trusted Advisor","AWS Config"],"correct":3,"a":"AWS Config","why":"Config records resource configuration history and evaluates compliance rules. CloudTrail answers who made API calls; CloudWatch monitors telemetry.","type":"mc"},{"id":138,"topic":3,"q":"A web app must inspect HTTP requests and block those matching malicious patterns. Which AWS service should it use?","options":["AWS WAF","AWS Shield","Amazon GuardDuty","AWS Network Firewall"],"correct":0,"a":"AWS WAF","why":"WAF inspects supported HTTP requests and matches web rules. Shield addresses DDoS; GuardDuty detects threats from telemetry.","type":"mc"},{"id":139,"topic":2,"q":"True or False: Downloading a report from AWS Artifact automatically makes a workload compliant.","options":["True","False"],"correct":1,"a":"False","why":"False. Artifact reports provide evidence of AWS controls; customers must still configure and operate a compliant workload.","type":"tf"},{"id":140,"topic":6,"q":"An EC2 workload needs very fast temporary scratch space. Data loss at stop or termination is acceptable. What fits?","options":["Amazon EFS","EC2 instance store","Amazon S3 Standard","Amazon EBS snapshot"],"correct":1,"a":"EC2 instance store","why":"Instance store is temporary local storage suitable for scratch data that can be discarded. EBS snapshots are backups, and EFS/S3 are different access models.","type":"mc"},{"id":141,"topic":6,"q":"Several Linux EC2 instances must concurrently mount the same managed file system. Which service fits?","options":["Amazon EBS","EC2 instance store","Amazon EFS","Amazon S3 Glacier Flexible Retrieval"],"correct":2,"a":"Amazon EFS","why":"EFS provides a shared managed filesystem for multiple Linux clients. EBS Multi-Attach is a specialized block feature, not a ready-to-use shared filesystem.","type":"mc"},{"id":142,"topic":6,"q":"S3 records should move to archival storage automatically after 180 days. What should be configured?","options":["S3 Versioning","S3 Transfer Acceleration","S3 Object Lock","An S3 Lifecycle transition"],"correct":3,"a":"An S3 Lifecycle transition","why":"A Lifecycle transition can move eligible objects after the configured age. Versioning preserves versions; Object Lock controls retention; Transfer Acceleration changes transfer paths.","type":"mc"},{"id":143,"topic":7,"q":"An order system needs transactions, SQL, and a relational schema. Which managed service is the best fit?","options":["Amazon RDS","Amazon DynamoDB","Amazon Redshift","Amazon Neptune"],"correct":0,"a":"Amazon RDS","why":"RDS is a managed relational choice for SQL, schemas, and transactional applications. Redshift focuses on analytical queries; DynamoDB and Neptune use other data models.","type":"mc"},{"id":144,"topic":4,"q":"Instances in a private subnet need outbound internet access but must reject internet-initiated connections. What helps?","options":["An internet gateway attached directly to each instance","A NAT gateway in a public subnet","An inbound-only internet gateway for IPv4","A VPC peering connection"],"correct":1,"a":"A NAT gateway in a public subnet","why":"A public NAT gateway, with appropriate routes and security controls, supports outbound IPv4 connections and their responses without unsolicited inbound connections.","type":"mc"},{"id":145,"topic":4,"q":"Which VPC control is stateless, works at the subnet level, and supports allow and deny rules?","options":["Security group","Route table","Network ACL","Internet gateway"],"correct":2,"a":"Network ACL","why":"Network ACLs are stateless subnet controls with ordered allow and deny rules. Security groups are stateful, resource-associated allow rules.","type":"mc"},{"id":146,"topic":3,"q":"An engineer wants an alarm when an EC2 instance's CPU utilization remains high. Which service should be used?","options":["AWS CloudTrail","AWS Config","Amazon EventBridge Scheduler","Amazon CloudWatch"],"correct":3,"a":"Amazon CloudWatch","why":"CloudWatch can evaluate CPU utilization with an alarm and configured evaluation periods. CloudTrail audits activity and Config records configurations.","type":"mc"},{"id":147,"topic":4,"q":"Which control acts as a stateful firewall for an EC2 instance and automatically permits responses to allowed traffic?","options":["Network ACL","Security group","Route table","Internet gateway"],"correct":1,"a":"Security group","why":"Security groups track allowed connections so response traffic is permitted. Network ACLs are stateless and require rules for both traffic directions.","type":"mc"},{"id":148,"topic":1,"q":"A finance team must separate AWS costs by department. What should it activate and apply?","options":["Tags for cost allocation","Security groups","AWS Artifact agreements","Service control policies"],"correct":0,"a":"Tags for cost allocation","why":"Cost allocation tags categorize eligible charges by department, project, or environment after activation for billing. They do not themselves reduce the cost.","type":"mc"},{"id":149,"topic":1,"q":"A company can commit to consistent USD-per-hour compute usage for one or three years. Which pricing option reduces cost?","options":["EC2 Capacity Reservations","Savings Plans","On-Demand pricing","AWS Free Tier"],"correct":1,"a":"Savings Plans","why":"Savings Plans exchange an eligible spending commitment over one or three years for discounts. Capacity reservations address capacity availability, not this discount mechanism.","type":"mc"},{"id":150,"topic":1,"q":"A two-day EC2 experiment has uncertain usage and no commitment. Which pricing model best fits?","options":["Savings Plans","Reserved Instances","On-Demand Instances","Dedicated Hosts with a three-year term"],"correct":2,"a":"On-Demand Instances","why":"On-Demand fits short-term uncertain usage without a long-term commitment. The other listed choices involve commitments or different allocation models.","type":"mc"},{"id":151,"topic":0,"q":"A retailer evaluates a cloud project by its effect on revenue and time to market. Which CAF perspective fits?","options":["Business","People","Platform","Operations"],"correct":0,"a":"Business","why":"Business connects cloud investment to organizational outcomes. People addresses workforce change; Platform builds the technical environment; Operations runs services.","type":"mc"},{"id":152,"topic":0,"q":"A hospital trains a cross-functional cloud team and changes its working culture. Which CAF perspective fits?","options":["People","Governance","Security","Platform"],"correct":0,"a":"People","why":"People focuses on culture, workforce, leadership, and organizational structure. Training and adoption are the central clues.","type":"mc"},{"id":153,"topic":0,"q":"A manufacturer requires budget tags, account owners, approved Regions, and review checkpoints. Which CAF perspective fits?","options":["Governance","Business","Operations","People"],"correct":0,"a":"Governance","why":"Governance coordinates initiatives, oversight, accountability, and transformation risk. The question is about organizational control rather than provisioning the platform.","type":"mc"},{"id":154,"topic":2,"q":"An identity policy allows s3:ListBucket on arn:aws:s3:::class-bucket. What permission does this statement grant?","options":["Listing object names in that bucket","Reading the contents of every object in that bucket","Creating and deleting every S3 bucket","Changing the account's billing settings"],"correct":0,"a":"Listing object names in that bucket","why":"ListBucket applies to a bucket ARN. Reading an object's content requires an appropriate action such as GetObject on the object ARN; listing and reading are separate permissions.","type":"mc"},{"id":155,"topic":2,"q":"What happens to the scope of an Allow statement when Action and Resource are both changed to \"*\"?","options":["It broadly allows actions and resources, still subject to other applicable restrictions","It limits access to one randomly selected resource","It changes the statement into an explicit deny","It allows only the resources created after the policy"],"correct":0,"a":"It broadly allows actions and resources, still subject to other applicable restrictions","why":"Wildcards broaden the statement and undermine least privilege. Applicable explicit denies, SCPs, boundaries, and other policy evaluation rules still matter.","type":"mc"},{"id":156,"topic":2,"q":"Where is an S3 bucket policy attached, and what does its Principal element identify?","options":["The bucket; the identity or identities addressed by the statement","An IAM group; the Region containing its users","An EC2 instance; the instance's operating system","The billing account; the department charged for storage"],"correct":0,"a":"The bucket; the identity or identities addressed by the statement","why":"A bucket policy is resource-based and is attached to the bucket. Principal identifies who the statement addresses; Action and Resource describe the permitted operation and target.","type":"mc"},{"id":157,"topic":2,"q":"An application needs managed storage and rotation of database passwords. Which service best fits?","options":["AWS Secrets Manager","AWS Certificate Manager","AWS Artifact","Amazon GuardDuty"],"correct":0,"a":"AWS Secrets Manager","why":"Secrets Manager stores and retrieves application secrets and supports configured rotation. ACM manages certificates; Artifact provides compliance documents; GuardDuty detects threat activity.","type":"mc"},{"id":158,"topic":2,"q":"Which statement correctly describes a TLS certificate?","options":["It binds identity information to a public key and does not contain the private key","It publishes the server's private key so clients can decrypt all traffic","It is the symmetric session key used for every future connection","It replaces the need to authenticate the server's identity"],"correct":0,"a":"It binds identity information to a public key and does not contain the private key","why":"The certificate contains a public key, identity information, issuer signature, and validity information. TLS establishes session keys during the handshake; the private key remains secret.","type":"mc"},{"id":159,"topic":1,"q":"A finance employee needs the monthly AWS invoice and must update payment settings. Where should they go?","options":["AWS Billing and Cost Management","AWS Pricing Calculator","AWS Artifact","AWS Config"],"correct":0,"a":"AWS Billing and Cost Management","why":"Billing and Cost Management handles invoices, payment, tax, and charge details. Calculator estimates future architecture cost; Artifact provides compliance documents; Config tracks configurations.","type":"mc"},{"id":160,"topic":6,"q":"What does storage durability describe?","options":["The likelihood that stored data remains intact and is not lost over time","The percentage of requests that receive a response within one millisecond","The number of CPU cores available to process a request","The speed at which DNS records propagate globally"],"correct":0,"a":"The likelihood that stored data remains intact and is not lost over time","why":"Durability concerns preservation of data. Availability concerns being able to access a service or data when needed; the concepts are related but distinct.","type":"mc"},{"id":161,"topic":6,"q":"Which general EBS workload-to-media pairing matches the slides?","options":["SSD for small/random I/O; HDD for large/sequential I/O","SSD for sequential I/O only; HDD for low-latency random database I/O","SSD for DNS queries; HDD for TLS certificate issuance","SSD and HDD have identical behavior for every access pattern"],"correct":0,"a":"SSD for small/random I/O; HDD for large/sequential I/O","why":"SSD-backed volumes generally suit random I/O and latency-sensitive workloads. HDD-backed volumes generally suit throughput-oriented sequential access; select an actual volume type from workload requirements.","type":"mc"},{"id":162,"topic":7,"q":"A relational application has variable demand and needs MySQL/PostgreSQL compatibility with automatically adjusted capacity. What fits?","options":["Amazon Aurora Serverless","Amazon Redshift","Amazon DynamoDB","Amazon Neptune"],"correct":0,"a":"Amazon Aurora Serverless","why":"Aurora Serverless is the relational, variable-capacity clue. Redshift is for analytical warehousing; DynamoDB is key-value/document; Neptune is graph-oriented.","type":"mc"},{"id":163,"topic":0,"q":"Select TWO advantages of cloud computing highlighted in the slides.","options":["Trade fixed expense for variable expense","Increase speed and agility","Purchase physical servers before accessing cloud capacity","Reserve maximum capacity permanently"],"correct":[0,1],"a":"Trade fixed expense for variable expense; Increase speed and agility","why":"Usage-based spending and rapid provisioning are cloud advantages. Mandatory hardware purchases and permanent peak allocation conflict with those benefits.","type":"multi"},{"id":164,"topic":0,"q":"Select TWO descriptions that correctly identify deployment environments.","options":["On premises: the organization operates infrastructure it owns or controls in its facilities","Hybrid: internal IT and cloud resources work together","Cloud: the customer must own the provider's physical data center","Hybrid: all internal resources must be shut down first"],"correct":[0,1],"a":"On premises: the organization operates infrastructure it owns or controls in its facilities; Hybrid: internal IT and cloud resources work together","why":"On-premises and hybrid describe where and how resources are operated. Hybrid integration allows resources to remain in both environments.","type":"multi"},{"id":165,"topic":2,"q":"Select TWO correct statements about IAM permissions and SCPs.","options":["An applicable IAM allow can grant access","An SCP sets a permission ceiling and cannot grant permissions by itself","An SCP allow overrides every IAM explicit deny","An IAM allow always overrides an inherited SCP deny"],"correct":[0,1],"a":"An applicable IAM allow can grant access; An SCP sets a permission ceiling and cannot grant permissions by itself","why":"An IAM allow operates within applicable guardrails. An inherited SCP deny can block a request even when an identity policy allows the action.","type":"multi"},{"id":166,"topic":2,"q":"Select TWO correct data-protection statements.","options":["Encryption at rest protects persisted data","TLS protects data in transit","A TLS certificate must expose the server's private key","Encryption removes the need to control access to keys"],"correct":[0,1],"a":"Encryption at rest protects persisted data; TLS protects data in transit","why":"Stored data and network traffic need appropriate protection. Certificates do not contain private keys, and encryption still requires suitable key and access controls.","type":"multi"},{"id":167,"topic":2,"q":"Select TWO responsibilities that remain with the customer.","options":["Patching the guest OS on EC2","Choosing who may access company data in RDS","Replacing failed physical disks in an AWS data center","Maintaining cooling in AWS facilities"],"correct":[0,1],"a":"Patching the guest OS on EC2; Choosing who may access company data in RDS","why":"Customers manage the EC2 guest software and their data-access decisions. AWS maintains physical facilities and hardware.","type":"multi"},{"id":168,"topic":4,"q":"Select TWO correct networking statements.","options":["A public subnet has an internet-gateway route","A security group is stateful and uses allow rules","A network ACL is stateful and permits only allow rules","A route table alone grants every application permission to accept traffic"],"correct":[0,1],"a":"A public subnet has an internet-gateway route; A security group is stateful and uses allow rules","why":"Routing chooses a traffic path, while security controls determine permitted traffic. Network ACLs are stateless and support allow and deny rules.","type":"multi"},{"id":169,"topic":6,"q":"Select TWO correct storage statements.","options":["Instance store is temporary host-attached storage","S3 Lifecycle can transition or expire eligible objects","An EBS snapshot is a running virtual machine","S3 Lifecycle classifies object contents before selecting an action"],"correct":[0,1],"a":"Instance store is temporary host-attached storage; S3 Lifecycle can transition or expire eligible objects","why":"Instance store is suitable for disposable data. Lifecycle uses age and other rule criteria, not semantic inspection of object content.","type":"multi"},{"id":170,"topic":1,"q":"Select TWO correct cost-management statements.","options":["Cost allocation tags attribute eligible spending to business categories","A budget alert is a notification; automatic action requires separate configuration","Cost Explorer is primarily a tool for encrypting invoices","Consolidated billing means every member account uses resources for free"],"correct":[0,1],"a":"Cost allocation tags attribute eligible spending to business categories; A budget alert is a notification; automatic action requires separate configuration","why":"Tags support attribution. Budgets can notify at thresholds, while automated remediation needs configured actions. Consolidation does not eliminate usage charges.","type":"multi"},{"id":171,"topic":6,"q":"True or False: S3 Lifecycle rules decide where to move an object by analyzing the meaning of its contents.","options":["True","False"],"correct":1,"a":"False","why":"False. Lifecycle rules act on age and configured criteria such as filters; they are not content-analysis rules.","type":"tf"},{"id":172,"topic":1,"q":"True or False: Receiving an AWS Budgets alert by itself automatically stops all AWS spending.","options":["True","False"],"correct":1,"a":"False","why":"False. An alert sends a notification. Automated responses require separately configured budget actions and do not imply a universal account spending cap.","type":"tf"}]}</script><script>
'use strict';
const D=JSON.parse(document.getElementById('quiz-data').textContent),Q=D.questions,byId=Object.fromEntries(Q.map(q=>[q.id,q])),$=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let test=null,screen='setup';
try{localStorage.removeItem('aws-essential100-v2')}catch{}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function keys(q){return Array.isArray(q.correct)?q.correct:[q.correct]}
function selected(id){return test.answers[id]||[]}
function correct(q){return JSON.stringify([...selected(q.id)].sort())===JSON.stringify([...keys(q)].sort())}
function setup(){screen='setup';$('#app').innerHTML=`<section class="panel"><h2>Build your practice test</h2><div class="settings"><label>Topic<select id="topic"><option value="all">All topics (${Q.length} questions)</option>${D.topics.map((t,i)=>`<option value="${i}">${esc(t)} (${Q.filter(q=>q.topic===i).length})</option>`).join('')}</select></label><label>Number of questions<select id="count"><option>10</option><option>25</option><option>50</option><option selected>65</option><option>100</option><option value="all">All available</option></select></label><label>Question order<select id="order"><option value="shuffle">Shuffle questions</option><option value="topic">Group by topic</option></select></label><label>Timer<select id="timer"><option value="0">No time limit</option><option value="30">30 minutes</option><option value="60">60 minutes</option><option value="90">90 minutes</option></select></label></div><button class="primary" data-start>Start practice test →</button><p class="small muted" style="margin-top:16px">If fewer questions are available, you’ll get the full selection. Answer choices are shuffled. Single-choice and true/false answers are checked immediately; multiple-select answers use a Check answer button.</p></section><p class="small muted">Keyboard: 1–4 select answers · Enter checks or continues · ← / → navigate.</p>`}
function getIds(topic,count,order){let pool=Q.filter(q=>topic==='all'||q.topic===+topic);if(order==='shuffle')pool=shuffle(pool);else pool=[...pool].sort((a,b)=>a.topic-b.topic||a.id-b.id);return pool.slice(0,count==='all'?pool.length:+count).map(q=>q.id)}
function start(ids,minutes=0){if(!ids.length)return;test={ids,order:Object.fromEntries(ids.map(id=>[id,shuffle(byId[id].options.map((_,i)=>i))])),answers:{},checked:{},pos:0,started:Date.now(),deadline:minutes?Date.now()+minutes*60000:null,finished:false,onlyMissed:false};question();window.scrollTo(0,0)}
function clock(){if(!test.deadline)return 'Untimed';let s=Math.max(0,Math.ceil((test.deadline-Date.now())/1000));return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')} remaining`}
function feedback(q){return `<div class="feedback ${correct(q)?'':'incorrect'}" role="status" aria-live="polite"><h4>${correct(q)?'✓ Correct':'✕ Incorrect'}</h4><b>Correct answer${keys(q).length>1?'s':''}</b><ul>${keys(q).map(i=>`<li>${esc(q.options[i])}</li>`).join('')}</ul><p>${esc(q.a)}</p><b>Explanation</b><p>${esc(q.why)}</p></div>`}
function question(){screen='question';const q=byId[test.ids[test.pos]],done=!!test.checked[q.id],n=Object.keys(test.checked).length;$('#app').innerHTML=`<div class="flex between"><b>Question ${test.pos+1} of ${test.ids.length}</b><span id="clock" class="small">${clock()}</span></div><div class="progress"><span style="width:${n/test.ids.length*100}%"></span></div><section class="panel"><span class="tag">${esc(D.topics[q.topic])}</span><h3 id="prompt">${esc(q.q)}</h3><p class="small"><b>${q.type==='multi'?`Select ${keys(q).length} answers`:'Select one answer'}</b></p><div class="choices" role="group" aria-labelledby="prompt">${test.order[q.id].map((idx,i)=>`<button class="choice ${selected(q.id).includes(idx)?'selected':''} ${done&&keys(q).includes(idx)?'correct':''} ${done&&selected(q.id).includes(idx)&&!keys(q).includes(idx)?'wrong':''}" data-pick="${idx}" aria-pressed="${selected(q.id).includes(idx)}" ${done?'disabled':''}><span class="letter">${'ABCD'[i]}</span><span class="label">${esc(q.options[idx])}</span>${done&&keys(q).includes(idx)?'<b>✓</b>':''}</button>`).join('')}</div>${q.type==='multi'&&!done?`<button class="primary check" data-check ${!selected(q.id).length?'disabled':''}>Check answer</button>`:''}${done?feedback(q):''}<div class="flex between nav"><button data-prev ${test.pos===0?'disabled':''}>← Previous</button>${test.pos<test.ids.length-1?'<button class="primary" data-next>Next →</button>':'<button class="primary" data-finish>Finish test</button>'}</div></section><div class="flex between"><span class="small muted">${n} checked · First answers count toward your score.</span><button data-finish>Finish & see score</button></div><div id="notice"></div><details class="panel"><summary>Jump to a question</summary><div class="map">${test.ids.map((id,i)=>`<button data-goto="${i}" class="${test.checked[id]?'answered':''}" ${i===test.pos?'aria-current="step"':''} aria-label="Question ${i+1}${test.checked[id]?', answered':''}">${i+1}</button>`).join('')}</div></details>`}
function pick(i){if(!test||test.finished)return;let q=byId[test.ids[test.pos]];if(test.checked[q.id]||!Number.isInteger(i)||i<0||i>=q.options.length)return;if(q.type==='multi'){let a=selected(q.id);a=a.includes(i)?a.filter(v=>v!==i):[...a,i];if(a.length)test.answers[q.id]=a;else delete test.answers[q.id]}else{test.answers[q.id]=[i];test.checked[q.id]=true}question()}
function check(){let q=byId[test.ids[test.pos]];if(!selected(q.id).length||test.checked[q.id])return;test.checked[q.id]=true;question()}
function move(pos){if(!test||test.finished)return;test.pos=Math.max(0,Math.min(test.ids.length-1,pos));question()}
function finish(force=false,expired=false){if(!test||test.finished)return;let unselected=test.ids.filter(id=>!selected(id).length).length,unconfirmed=test.ids.filter(id=>selected(id).length&&!test.checked[id]).length;if(!force&&(unselected||unconfirmed)){$('#notice').innerHTML=`<div class="notice"><p>${unselected} unanswered question${unselected===1?'':'s'} will count as incorrect.${unconfirmed?` Your current selections on ${unconfirmed} unchecked question${unconfirmed===1?'':'s'} will be graded as submitted.`:''}</p><div class="flex"><button class="primary" data-confirm>Finish anyway</button><button data-unfinished>Return to unfinished questions</button></div></div>`;return}test.finished=true;test.ended=Date.now();test.expired=expired;results();window.scrollTo(0,0)}
function stats(){let right=test.ids.filter(id=>correct(byId[id])).length,unanswered=test.ids.filter(id=>!selected(id).length).length;return {right,unanswered,wrong:test.ids.length-right-unanswered,percent:Math.round(100*right/test.ids.length)}}
function results(){screen='results';let s=stats(),review=test.ids.filter(id=>!test.onlyMissed||!correct(byId[id]));$('#app').innerHTML=`<section class="panel"><span class="tag">TEST COMPLETE${test.expired?' · TIME EXPIRED':''}</span><h2 class="score">${s.percent}%</h2><p><b>${s.right} / ${test.ids.length} correct</b> · ${s.wrong} incorrect · ${s.unanswered} unanswered</p><div class="flex"><button class="primary" data-new>New test</button><button data-retry ${s.right===test.ids.length?'disabled':''}>Practice missed questions</button></div></section><section class="panel"><h2>By topic</h2><div class="tablewrap"><table><thead><tr><th>Topic</th><th>Correct</th><th>Score</th></tr></thead><tbody>${D.topics.map((t,i)=>{let ids=test.ids.filter(id=>byId[id].topic===i);if(!ids.length)return '';let n=ids.filter(id=>correct(byId[id])).length;return `<tr><td>${esc(t)}</td><td>${n} / ${ids.length}</td><td>${Math.round(100*n/ids.length)}%</td></tr>`}).join('')}</tbody></table></div></section><section class="panel"><div class="flex between"><h2>Answer review</h2><select id="reviewFilter" aria-label="Answer review filter"><option value="all">All questions</option><option value="missed" ${test.onlyMissed?'selected':''}>Incorrect & unanswered</option></select></div>${review.map(id=>{let q=byId[id];return `<article class="review"><span class="tag">${esc(D.topics[q.topic])}</span><h3>${esc(q.q)}</h3><p class="small"><b>Your answer:</b> ${selected(id).length?selected(id).map(i=>esc(q.options[i])).join('; '):'Not answered'}</p>${feedback(q)}</article>`}).join('')||'<p>No missed questions.</p>'}</section>`}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b||b.disabled)return;let d=b.dataset;if(b.hasAttribute('data-start'))start(getIds($('#topic').value,$('#count').value,$('#order').value),+$('#timer').value);if(d.pick!==undefined)pick(+d.pick);if(b.hasAttribute('data-check'))check();if(b.hasAttribute('data-prev'))move(test.pos-1);if(b.hasAttribute('data-next'))move(test.pos+1);if(d.goto!==undefined)move(+d.goto);if(b.hasAttribute('data-finish'))finish();if(b.hasAttribute('data-confirm'))finish(true);if(b.hasAttribute('data-unfinished'))move(test.ids.findIndex(id=>!test.checked[id]));if(b.hasAttribute('data-new')){test=null;setup();window.scrollTo(0,0)}if(b.hasAttribute('data-retry')){let ids=test.ids.filter(id=>!correct(byId[id]));start(shuffle(ids))}});
document.addEventListener('change',e=>{if(e.target.id==='reviewFilter'){test.onlyMissed=e.target.value==='missed';results()}});
document.addEventListener('keydown',e=>{if(screen!=='question'||!test||test.finished||/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)||e.ctrlKey||e.altKey||e.metaKey||e.repeat)return;let q=byId[test.ids[test.pos]];if(/^[1-4]$/.test(e.key)){e.preventDefault();pick(test.order[q.id][+e.key-1])}if(e.key==='ArrowLeft'){e.preventDefault();move(test.pos-1)}if(e.key==='ArrowRight'||e.key==='Enter'&&e.target.tagName!=='BUTTON'){e.preventDefault();if(e.key==='Enter'&&q.type==='multi'&&!test.checked[q.id])check();else if(test.pos<test.ids.length-1)move(test.pos+1);else finish()}});
setInterval(()=>{if(test&&!test.finished&&test.deadline){if($('#clock'))$('#clock').textContent=clock();if(Date.now()>=test.deadline)finish(true,true)}},1000);
window.addEventListener('pageshow',e=>{if(e.persisted){test=null;setup()}});
setup();
</script></body></html>
